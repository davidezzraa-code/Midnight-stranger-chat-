<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midnight Stranger Chat</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://tailwindcss.com"></script>
    <!-- Loading JetBrains Mono & Space Grotesk for the authentic Chitchat style -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=JetBrains+Mono:wght@700;800&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            font-family: 'Space Grotesk', sans-serif;
        }
        .chitchat-logo {
            font-family: 'JetBrains Mono', monospace;
            text-transform: lowercase;
            letter-spacing: -0.06em;
        }
        /* Stark micro scrollbar matching Chitchat's platform interface */
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: #000000; }
        ::-webkit-scrollbar-thumb { background: #222222; }
    </style>
</head>
<body class="text-white h-screen flex flex-col antialiased">

    <!-- Chitchat Header Layout -->
    <header class="bg-[#000000] border-b border-[#161616] px-6 py-4 flex justify-between items-center select-none">
        <h1 class="chitchat-logo text-xl font-extrabold tracking-tighter text-white">
            midnight<span class="text-neutral-600 font-bold">stranger</span>
        </h1>
        <div id="status" class="text-[10px] font-mono tracking-widest text-neutral-500 bg-[#0c0c0c] border border-[#1a1a1a] px-2.5 py-1 rounded">
            OFFLINE
        </div>
    </header>

    <!-- Main Live Message Screen -->
    <main id="chat-box" class="flex-1 p-6 overflow-y-auto max-w-2xl w-full mx-auto flex flex-col justify-end space-y-3.5">
        <div class="text-center max-w-xs mx-auto my-auto space-y-1 transition-all select-none" id="welcome-msg">
            <p class="text-xs font-semibold text-neutral-500 uppercase tracking-widest font-mono">1v1 Anonymous</p>
            <p class="text-xs text-neutral-600">Press Start Chat below to match with a stranger instantly.</p>
        </div>
    </main>

    <!-- Bottom Controls (Start Button and Textbox Side-By-Side) -->
    <footer class="p-4 bg-[#000000] border-t border-[#161616] sticky bottom-0">
        <div class="max-w-2xl mx-auto flex items-center gap-2">
            
            <!-- Action Trigger placed first on the far left -->
            <button id="action-btn" class="bg-white hover:bg-neutral-200 text-black font-bold text-xs uppercase tracking-wider h-[46px] px-5 rounded transition-all active:scale-[0.98] whitespace-nowrap">
                Start Chat
            </button>
            
            <!-- Compact Message Entry Bar -->
            <input id="msg-input" type="text" placeholder="Type a message..." disabled
                class="flex-1 bg-[#0a0a0a] border border-[#1a1a1a] text-sm h-[46px] px-4 text-white placeholder-neutral-700 rounded focus:outline-none focus:border-[#333333] focus:bg-[#0f0f0f] disabled:opacity-20 disabled:cursor-not-allowed transition-all" />
            
            <!-- Minimal Send Button -->
            <button id="send-btn" disabled class="bg-[#0a0a0a] border border-[#1a1a1a] text-neutral-500 hover:text-white hover:border-[#333333] text-xs uppercase tracking-wider font-bold h-[46px] px-4 rounded transition-all active:scale-[0.98] disabled:opacity-10 disabled:cursor-not-allowed">
                Send
            </button>
        </div>
    </footer>

    <script>
        const socket = io();

        const chatBox = document.getElementById('chat-box');
        const welcomeMsg = document.getElementById('welcome-msg');
        const statusDiv = document.getElementById('status');
        const actionBtn = document.getElementById('action-btn');
        const msgInput = document.getElementById('msg-input');
        const sendBtn = document.getElementById('send-btn');

        let isChatting = false;

        function updateStatus(text, borderAndTextColor) {
            statusDiv.textContent = text;
            statusDiv.className = `text-[10px] font-mono tracking-widest bg-black px-2.5 py-1 rounded border ${borderAndTextColor}`;
        }

        function appendSystemMessage(text) {
            if(welcomeMsg) welcomeMsg.remove();
            const msgRow = document.createElement('div');
            msgRow.className = "text-center text-[10px] tracking-wider font-mono text-neutral-600 my-1 uppercase py-1 px-4";
            msgRow.textContent = text;
            chatBox.appendChild(msgRow);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendMessage(text, isMe) {
            const container = document.createElement('div');
            container.className = `flex w-full ${isMe ? 'justify-end' : 'justify-start'}`;

            const bubble = document.createElement('div');
            // Clean, low-radius message boxes identical to Chitchat style
            bubble.className = `max-w-[85%] rounded-md px-3.5 py-2 text-sm leading-relaxed ${
                isMe ? 'bg-[#1a1a1a] text-white border border-[#262626]' : 'bg-[#0a0a0a] text-neutral-300 border border-[#161616]'
            }`;
            bubble.textContent = text;

            container.appendChild(bubble);
            chatBox.appendChild(container);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        actionBtn.addEventListener('click', () => {
            if (!isChatting) {
                socket.emit('findMatch');
                actionBtn.textContent = 'Skip';
                actionBtn.className = "bg-neutral-900 hover:bg-neutral-800 text-rose-500 border border-[#222222] font-bold text-xs uppercase tracking-wider h-[46px] px-5 rounded transition-all active:scale-[0.98] whitespace-nowrap";
            } else {
                socket.emit('findMatch');
            }
        });

        function sendMessage() {
            const text = msgInput.value.trim();
            if (text && isChatting) {
                appendMessage(text, true);
                socket.emit('sendMessage', text);
                msgInput.value = '';
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        socket.on('waiting', () => {
            isChatting = false;
            msgInput.disabled = true;
            sendBtn.disabled = true;
            updateStatus('SEARCHING', 'border-amber-500/30 text-amber-500');
            appendSystemMessage('connecting to the pool...');
        });

        socket.on('matched', () => {
            isChatting = true;
            msgInput.disabled = false;
            sendBtn.disabled = false;
            msgInput.focus();
            updateStatus('CONNECTED', 'border-emerald-500/30 text-emerald-500');
            chatBox.innerHTML = ''; 
            appendSystemMessage('system: matched with a stranger.');
        });

        socket.on('receiveMessage', (message) => {
            appendMessage(message, false);
        });

        socket.on('partnerDisconnected', () => {
            isChatting = false;
            msgInput.disabled = true;
            sendBtn.disabled = true;
            updateStatus('DISCONNECTED', 'border-rose-500/30 text-rose-500');
            appendSystemMessage('system: stranger left the chat room.');
            actionBtn.textContent = 'Start Chat';
            actionBtn.className = "bg-white hover:bg-neutral-200 text-black font-bold text-xs uppercase tracking-wider h-[46px] px-5 rounded transition-all active:scale-[0.98] whitespace-nowrap";
        });
    </script>
</body>
</html>
