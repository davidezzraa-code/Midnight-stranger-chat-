<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midnight Stranger Chat</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://tailwindcss.com"></script>
    <!-- Importing a premium geometric font for the website name -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Syne:wght@700;800&display=swap" rel="family">
    <style>
        body {
            background-color: #000000;
        }
        .brand-font {
            font-family: 'Syne', sans-serif;
            text-transform: uppercase;
            letter-spacing: -0.05em;
        }
        /* Custom scrollbar for absolute black design */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #000000; }
        ::-webkit-scrollbar-thumb { background: #333333; border-radius: 2px; }
    </style>
</head>
<body class="text-white h-screen flex flex-col font-sans antialiased">

    <!-- Minimal Top Navigation Header -->
    <header class="bg-[#000000] border-b border-[#222222] p-5 flex justify-between items-center">
        <h1 class="brand-font text-2xl font-extrabold tracking-tighter text-white">
            midnight<span class="text-neutral-500">stranger</span>
        </h1>
        <div id="status" class="text-xs font-mono tracking-widest uppercase text-neutral-400 border border-[#222222] px-3 py-1 rounded">
            OFFLINE
        </div>
    </header>

    <!-- Main Chat Feed Window -->
    <main id="chat-box" class="flex-1 p-6 overflow-y-auto max-w-4xl w-full mx-auto flex flex-col justify-end space-y-4">
        <div class="text-center text-neutral-500 max-w-xs mx-auto my-auto space-y-1" id="welcome-msg">
            <p class="text-sm font-semibold text-neutral-400">Anonymous Midnight Chat</p>
            <p class="text-xs text-neutral-600">Press Start Chat below to meet someone instantly.</p>
        </div>
    </main>

    <!-- Bottom Interface Layout (Action Controls First) -->
    <footer class="p-6 bg-[#000000] border-t border-[#222222]">
        <div class="max-w-4xl mx-auto flex items-center gap-3">
            
            <!-- Start / Skip Button Placed First on the Left side -->
            <button id="action-btn" class="bg-white hover:bg-neutral-200 text-black font-bold text-xs uppercase tracking-wider px-6 py-4 rounded transition-all duration-150 active:scale-95 whitespace-nowrap">
                Start Chat
            </button>
            
            <!-- Message Input Area directly next to it -->
            <input id="msg-input" type="text" placeholder="Type your message..." disabled
                class="flex-1 bg-[#111111] border border-[#222222] text-sm px-4 py-4 text-white placeholder-neutral-600 rounded focus:outline-none focus:border-neutral-400 disabled:opacity-30 disabled:cursor-not-allowed" />
            
            <!-- Send Trigger Button -->
            <button id="send-btn" disabled class="bg-[#111111] border border-[#222222] text-neutral-400 hover:text-white hover:border-neutral-400 text-xs uppercase tracking-wider font-bold px-5 py-4 rounded transition-all disabled:opacity-20 disabled:cursor-not-allowed">
                Send
            </button>
        </div>
    </footer>

    <script>
        const socket = io();

        const chatBox = document.getElementById('chat-box');
        const welcomeMsg = document.getElementById('welcome-msg');
        const statusDiv = document.getElementById('status');
        const actionBtn = document.getElementById('action-btn');
        const msgInput = document.getElementById('msg-input');
        const sendBtn = document.getElementById('send-btn');

        let isChatting = false;

        function updateStatus(text, borderClass) {
            statusDiv.textContent = text;
            statusDiv.className = `text-xs font-mono tracking-widest uppercase bg-black px-3 py-1 rounded border ${borderClass}`;
        }

        function appendSystemMessage(text) {
            if(welcomeMsg) welcomeMsg.remove();
            const msgRow = document.createElement('div');
            msgRow.className = "text-center text-[10px] tracking-widest font-mono text-neutral-500 my-2 uppercase bg-[#111111] border border-[#222222] py-2 px-4 rounded max-w-xs mx-auto";
            msgRow.textContent = text;
            chatBox.appendChild(msgRow);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendMessage(text, isMe) {
            const container = document.createElement('div');
            container.className = `flex w-full ${isMe ? 'justify-end' : 'justify-start'}`;

            const bubble = document.createElement('div');
            bubble.className = `max-w-[80%] rounded px-4 py-3 text-sm leading-relaxed ${
                isMe ? 'bg-white text-black font-medium' : 'bg-[#111111] text-white border border-[#222222]'
            }`;
            bubble.textContent = text;

            container.appendChild(bubble);
            chatBox.appendChild(container);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        actionBtn.addEventListener('click', () => {
            if (!isChatting) {
                socket.emit('findMatch');
                actionBtn.textContent = 'Skip';
                actionBtn.className = "bg-neutral-900 hover:bg-neutral-800 text-rose-500 border border-neutral-800 font-bold text-xs uppercase tracking-wider px-6 py-4 rounded transition-all duration-150 active:scale-95 whitespace-nowrap";
            } else {
                socket.emit('findMatch');
            }
        });

        function sendMessage() {
            const text = msgInput.value.trim();
            if (text && isChatting) {
                appendMessage(text, true);
                socket.emit('sendMessage', text);
                msgInput.value = '';
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        socket.on('waiting', () => {
            isChatting = false;
            msgInput.disabled = true;
            sendBtn.disabled = true;
            updateStatus('SEARCHING', 'border-amber-500/40 text-amber-400');
            appendSystemMessage('Searching for a stranger...');
        });

        socket.on('matched', () => {
            isChatting = true;
            msgInput.disabled = false;
            sendBtn.disabled = false;
            msgInput.focus();
            updateStatus('CONNECTED', 'border-emerald-500/40 text-emerald-400');
            chatBox.innerHTML = ''; 
            appendSystemMessage('System: Stranger paired successfully.');
        });

        socket.on('receiveMessage', (message) => {
            appendMessage(message, false);
        });

        socket.on('partnerDisconnected', () => {
            isChatting = false;
            msgInput.disabled = true;
            sendBtn.disabled = true;
            updateStatus('DISCONNECTED', 'border-rose-500/40 text-rose-500');
            appendSystemMessage('System: Stranger left the chat.');
            actionBtn.textContent = 'Start Chat';
            actionBtn.className = "bg-white hover:bg-neutral-200 text-black font-bold text-xs uppercase tracking-wider px-6 py-4 rounded transition-all duration-150 active:scale-95 whitespace-nowrap";
        });
    </script>
</body>
</html>
