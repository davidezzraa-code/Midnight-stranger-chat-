<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midnight Stranger Chat</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://tailwindcss.com"></script>
    <style>
        /* Premium custom scrollbar styling */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #0b0f19; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
        
        /* Frosted Glass effect class */
        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-[#090d16] text-slate-200 h-screen flex flex-col font-sans antialiased selection:bg-indigo-500/30">

    <!-- Premium Minimal Header -->
    <header class="glass-panel border-b border-slate-800/60 p-5 sticky top-0 z-50 flex justify-between items-center transition-all">
        <div class="flex items-center gap-3">
            <div class="h-2.5 w-2.5 rounded-full bg-indigo-500 animate-pulse"></div>
            <h1 class="text-lg font-medium tracking-tight text-white">
                midnight<span class="text-indigo-400 font-light">stranger</span>
            </h1>
        </div>
        <div id="status" class="text-xs tracking-wider uppercase font-semibold text-slate-400 bg-slate-900/80 px-3 py-1.5 rounded-md border border-slate-800/80 transition-all">
            Offline
        </div>
    </header>

    <!-- Main Dynamic Chat Interface -->
    <main id="chat-box" class="flex-1 p-6 overflow-y-auto max-w-3xl w-full mx-auto flex flex-col justify-end space-y-5">
        <div class="text-center text-slate-500 max-w-sm mx-auto my-auto space-y-2 transition-opacity" id="welcome-msg">
            <p class="text-base text-slate-400 font-medium">Safe. Anonymous. Instant.</p>
            <p class="text-xs leading-relaxed text-slate-500">Click the action button below to instantly connect with a random person under the cover of midnight.</p>
        </div>
    </main>

    <!-- Sleek Typing Feedback Banner -->
    <div class="max-w-3xl w-full mx-auto px-6 h-5">
        <div id="typing-indicator" class="text-xs text-indigo-400/90 font-medium tracking-wide hidden animate-pulse">
            Stranger is typing...
        </div>
    </div>

    <!-- Minimalist Interface Control Center -->
    <footer class="p-6 bg-gradient-to-t from-[#090d16] via-[#090d16]/90 to-transparent sticky bottom-0">
        <div class="max-w-3xl mx-auto flex items-center gap-4 bg-slate-900/40 p-2 rounded-xl border border-slate-800/50 glass-panel shadow-2xl">
            
            <button id="action-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm px-6 py-3 rounded-lg transition-all duration-200 active:scale-95 shadow-lg shadow-indigo-600/10 whitespace-nowrap">
                Start Chat
            </button>
            
            <input id="msg-input" type="text" placeholder="Write an anonymous message..." disabled
                class="flex-1 bg-transparent text-sm px-2 py-3 text-slate-100 placeholder-slate-500 focus:outline-none disabled:opacity-30 disabled:cursor-not-allowed" />
            
            <button id="send-btn" disabled class="text-indigo-400 hover:text-indigo-300 font-medium text-sm px-4 py-3 rounded-lg transition-all disabled:opacity-20 disabled:cursor-not-allowed">
                Send
            </button>
        </div>
    </footer>

    <script>
        const socket = io();

        const chatBox = document.getElementById('chat-box');
        const welcomeMsg = document.getElementById('welcome-msg');
        const statusDiv = document.getElementById('status');
        const actionBtn = document.getElementById('action-btn');
        const msgInput = document.getElementById('msg-input');
        const sendBtn = document.getElementById('send-btn');
        const typingIndicator = document.getElementById('typing-indicator');

        let isChatting = false;
        let typingTimeout;

        function updateStatus(text, borderAndTextColorClass) {
            statusDiv.textContent = text;
            statusDiv.className = `text-xs tracking-wider uppercase font-semibold bg-slate-900/80 px-3 py-1.5 rounded-md border ${borderAndTextColorClass}`;
        }

        function appendSystemMessage(text) {
            if(welcomeMsg) welcomeMsg.remove();
            const msgRow = document.createElement('div');
            msgRow.className = "text-center text-xs tracking-wide font-medium text-slate-500 my-3 uppercase bg-slate-900/30 border border-slate-800/40 py-2 px-4 rounded-lg max-w-xs mx-auto";
            msgRow.textContent = text;
            chatBox.appendChild(msgRow);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendMessage(text, isMe) {
            const container = document.createElement('div');
            container.className = `flex w-full ${isMe ? 'justify-end' : 'justify-start'}`;

            const bubble = document.createElement('div');
            bubble.className = `max-w-[80%] rounded-xl px-4 py-3 text-sm leading-relaxed shadow-sm transition-all ${
                isMe ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-slate-900 text-slate-200 rounded-bl-none border border-slate-800/80'
            }`;
            bubble.textContent = text;

            container.appendChild(bubble);
            chatBox.appendChild(container);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        actionBtn.addEventListener('click', () => {
            if (!isChatting) {
                socket.emit('findMatch');
                actionBtn.textContent = 'Skip';
                actionBtn.className = "bg-slate-800 hover:bg-slate-700/80 text-rose-400 hover:text-rose-300 font-medium text-sm px-6 py-3 rounded-lg border border-slate-700/50 transition-all duration-200 active:scale-95 shadow-md";
            } else {
                socket.emit('findMatch');
            }
        });

        function sendMessage() {
            const text = msgInput.value.trim();
            if (text && isChatting) {
                appendMessage(text, true);
                socket.emit('sendMessage', text);
                msgInput.value = '';
                socket.emit('typing', false);
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        msgInput.addEventListener('input', () => {
            if (!isChatting) return;
            socket.emit('typing', true);
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                socket.emit('typing', false);
            }, 2000);
        });

        socket.on('waiting', () => {
            isChatting = false;
            msgInput.disabled = true;
            sendBtn.disabled = true;
            typingIndicator.classList.add('hidden');
            updateStatus('Searching', 'border-amber-500/20 text-amber-400');
            appendSystemMessage('Looking for someone...');
        });

        socket.on('matched', () => {
            isChatting = true;
            msgInput.disabled = false;
            sendBtn.disabled = false;
            msgInput.focus();
            updateStatus('Connected', 'border-emerald-500/20 text-emerald-400');
            chatBox.innerHTML = ''; 
            appendSystemMessage('Connected with a stranger');
        });

        socket.on('receiveMessage', (message) => {
            appendMessage(message, false);
        });

        socket.on('partnerTyping', (isTyping) => {
            if (isTyping) {
                typingIndicator.classList.remove('hidden');
            } else {
                typingIndicator.classList.add('hidden');
            }
        });

        socket.on('partnerDisconnected', () => {
            isChatting = false;
            msgInput.disabled = true;
            sendBtn.disabled = true;
            typingIndicator.classList.add('hidden');
            updateStatus('Disconnected', 'border-rose-500/20 text-rose-400');
            appendSystemMessage('Stranger left the conversation');
            actionBtn.textContent = 'Find Stranger';
            actionBtn.className = "bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm px-6 py-3 rounded-lg transition-all duration-200 active:scale-95 shadow-lg shadow-indigo-600/10 whitespace-nowrap";
        });
    </script>
</body>
</html>
